name: CI

on:
  push:
    branches: [main]  # CI on merge to main
  pull_request:       # CI on all PRs (single run per update)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, Typecheck, Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Pocketbase
        uses: ./.github/actions/setup-pocketbase

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test:run

      - name: Story docs check
        run: pnpm story:docs:check

  cli-check:
    name: CLI - Lint, Typecheck, Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Pocketbase
        uses: ./.github/actions/setup-pocketbase

      - name: CLI Typecheck
        run: pnpm --filter @saf-site/cli typecheck

      - name: CLI Lint
        run: pnpm --filter @saf-site/cli lint:check

      - name: CLI Test
        run: pnpm --filter @saf-site/cli test:run

  e2e:
    name: Accessibility E2E (Playwright)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # Starts Pocketbase (port 8090) in the background; the Playwright config's
      # webServer launches `vitepress dev`, whose data loaders query it.
      - name: Setup Pocketbase
        uses: ./.github/actions/setup-pocketbase

      - name: Run accessibility E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
